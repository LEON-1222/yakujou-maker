<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTP薬剤登録・保存テスト</title><style>body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;margin:0;background:#f4f7fa;color:#1c2e3c}main{max-width:760px;margin:auto;padding:15px}section{background:white;border:1px solid #cad5de;border-radius:12px;padding:16px;margin:13px 0}h1{font-size:22px}label{display:block;margin:10px 0 5px;font-weight:600}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #9dabb8;border-radius:8px;font:inherit}button{border:0;background:#125d94;color:white;border-radius:8px;font-weight:bold;font-size:15px;padding:12px;margin:5px 5px 5px 0;cursor:pointer}button.secondary{background:#52677b}button.danger{background:#a42d39}img{width:110px;height:95px;object-fit:contain;border:1px solid #cbd5df;border-radius:7px}.item{display:flex;gap:12px;border-top:1px solid #ddd;padding:12px 0;flex-wrap:wrap}.item div{flex:1;min-width:160px}small,#status{color:#475c70}#status{white-space:pre-wrap} .muted{font-size:12px} </style></head><body><main><h1>PTP薬剤登録・保存テスト</h1><p>薬情メーカー本体から独立した検証用。データは現在のブラウザ内に保存され、他端末へ同期されません。実患者情報は入力しないでください。</p><section><h2>薬剤を登録</h2><label for="name">薬品名・規格（必須）</label><input id="name" placeholder="例：サンプル錠10mg" autocomplete="off"><label for="gtin">PTP GTIN（任意・14桁）</label><input id="gtin" inputmode="numeric" maxlength="14" placeholder="14桁・読み取れなければ空欄"><label for="shelf">棚番号（任意）</label><input id="shelf" placeholder="例：A棚 3段 2列"><label for="photo">PTP表面の写真（任意）</label><input id="photo" type="file" accept="image/*" capture="environment"><div><img id="preview" hidden alt="登録するPTP写真"></div><button id="save">登録・更新して保存</button><button id="clear" class="secondary">入力を消す</button><p id="status" role="status">準備中</p></section><section><h2>登録済みの薬剤 <span id="count"></span></h2><label for="search">検索</label><input id="search" placeholder="薬品名・GTIN・棚番号で検索"><div id="items"></div><button id="selftest" class="secondary">保存・読み出しを自動検査</button><button id="export" class="secondary">バックアップJSONを保存</button><label for="restore">バックアップJSONを読み込む（同じ薬品名は上書き）</label><input id="restore" type="file" accept="application/json,.json"><p class="muted">本番では共通データベースが必要です。ブラウザのデータ削除で登録内容が消える可能性があります。</p></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let db,image='',editing=null;
const store='drugs';const sanitize=s=>String(s||'').trim();const key=s=>sanitize(s).normalize('NFKC').toLowerCase().replace(/\s+/g,'');
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function request(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('DB request error'))})}
function tx(mode){return db.transaction(store,mode).objectStore(store)}
function get(id){return request(tx('readonly').get(id))}function all(){return request(tx('readonly').getAll())}function put(rec){return request(tx('readwrite').put(rec))}function del(id){return request(tx('readwrite').delete(id))}
function open(){return new Promise((resolve,reject)=>{const r=indexedDB.open('ptp-register-independent-v1',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(store))r.result.createObjectStore(store,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function status(s){$('status').textContent=s}function clear(){editing=null;image='';for(const id of ['name','gtin','shelf'])$(id).value='';$('photo').value='';$('preview').hidden=true;$('preview').removeAttribute('src')}
function validGTIN(v){if(!v)return true;if(!/^\d{14}$/.test(v))return false;let sum=0;for(let i=0;i<13;i++)sum+=Number(v[i])*(i%2===0?3:1);return (10-sum%10)%10===Number(v[13])}
async function photoData(file){if(!file)return null;if(!file.type.startsWith('image/'))throw Error('写真ファイルを選択してください');if(file.size>15*1024*1024)throw Error('15MB以下の写真にしてください');const bm=await createImageBitmap(file),c=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(bm.width,bm.height));c.width=Math.round(bm.width*scale);c.height=Math.round(bm.height*scale);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);bm.close?.();return c.toDataURL('image/jpeg',.77)}
$('photo').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;image=await photoData(f);$('preview').src=image;$('preview').hidden=false;status('写真を読み込みました。登録・更新して保存を押してください')}catch(err){status('写真エラー：'+err.message)}};
$('save').onclick=async()=>{const name=sanitize($('name').value),gtin=sanitize($('gtin').value).replace(/\D/g,''),shelf=sanitize($('shelf').value);if(!name){status('薬品名・規格を入力してください');return}if(!validGTIN(gtin)){status('GTINは空欄か、チェックデジットが正常な14桁を指定してください');return}try{const id=key(name);const prev=await get(id);if(editing&&editing!==id){status('薬品名を変更する場合は、新規登録として保存してください');return}const rec={id,name,gtin,shelf,image:image||(prev?.image||''),updated:new Date().toISOString()};await put(rec);const saved=await get(id);if(saved?.name!==name||saved?.gtin!==gtin)throw Error('保存後の照合に失敗');status('保存成功：'+name+'（再読み取りで確認済み）');clear();await render()}catch(err){status('保存失敗：'+(err.name||'Error')+' '+err.message)}};
$('clear').onclick=()=>{clear();status('入力をクリアしました')};$('search').oninput=render;
async function render(){try{const rows=await all(),term=key($('search').value);$('count').textContent='('+rows.length+'件)';const matched=rows.filter(r=>[r.name,r.gtin,r.shelf].some(x=>key(x).includes(term)));$('items').innerHTML=matched.map(r=>`<article class="item">${r.image?`<img src="${r.image}" alt="${escape(r.name)}の写真">`:'<span class="muted">写真なし</span>'}<div><b>${escape(r.name)}</b><p>GTIN：${escape(r.gtin||'未登録')}<br>棚：${escape(r.shelf||'未登録')}</p><button data-edit="${escape(r.id)}">編集</button><button class="danger" data-delete="${escape(r.id)}">削除</button></div></article>`).join('')||'<p>該当する薬剤はありません</p>';for(const btn of $('items').querySelectorAll('[data-edit]'))btn.onclick=async()=>{const r=await get(btn.dataset.edit);if(!r)return;editing=r.id;for(const f of ['name','gtin','shelf'])$(f).value=r[f]||'';image=r.image||'';$('preview').hidden=!image;if(image)$('preview').src=image;status('編集中：'+r.name);window.scrollTo({top:0,behavior:'smooth'})};for(const btn of $('items').querySelectorAll('[data-delete]'))btn.onclick=async()=>{if(!confirm('この薬剤を削除しますか？'))return;await del(btn.dataset.delete);await render()}}catch(err){status('一覧エラー：'+err.message)}}
$('selftest').onclick=async()=>{const id='__test__'+Date.now(),test={id,name:'テスト薬剤',gtin:'',shelf:'B-2',image:'data:image/png;base64,iVBORw0KGgo=',updated:new Date().toISOString()};try{await put(test);const a=await get(id);if(!a||a.shelf!=='B-2'||a.image!==test.image)throw Error('読み出し不一致');await del(id);if(await get(id))throw Error('削除できません');status('セルフテスト成功：保存→照合→削除');await render()}catch(err){await del(id).catch(()=>{});status('セルフテスト失敗：'+err.message)}};
$('export').onclick=async()=>{try{const rows=await all(),blob=new Blob([JSON.stringify({schema:1,drugs:rows},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ptp-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);status('バックアップを書き出しました')}catch(err){status('書き出し失敗：'+err.message)}};
$('restore').onchange=async e=>{try{const f=e.target.files?.[0];if(!f)return;const parsed=JSON.parse(await f.text());if(parsed.schema!==1||!Array.isArray(parsed.drugs)||parsed.drugs.length>10000)throw Error('この形式のバックアップには対応していません');if(!confirm(parsed.drugs.length+'件の薬剤を復元しますか？'))return;let n=0;for(const x of parsed.drugs){if(typeof x.name!=='string'||!x.name.trim())continue;const id=key(x.name);const rec={id,name:x.name.slice(0,250),gtin:validGTIN(x.gtin||'')?(x.gtin||''):'',shelf:String(x.shelf||'').slice(0,200),image:typeof x.image==='string'&&/^data:image\/(?:jpeg|png|webp);base64,/.test(x.image)?x.image:'',updated:new Date().toISOString()};await put(rec);n++}await render();status(n+'件を復元しました')}catch(err){status('復元失敗：'+err.message)}};
open().then(x=>{db=x;status('保存データベースを開きました');render()}).catch(err=>status('データベース起動失敗：'+err.message));
})();
</script></body></html>
