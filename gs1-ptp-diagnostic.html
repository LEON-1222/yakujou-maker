<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GS1読取診断</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:15px auto;padding:10px;background:#f3f6fa}section{background:white;padding:14px;margin:12px 0;border-radius:10px}button{padding:12px;background:#1267a6;color:white;border:0;border-radius:7px;margin:5px}video,img{width:100%;max-height:340px;object-fit:contain;background:#333}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f2f4;padding:12px}input{max-width:100%}</style><h2>PTP GS1読取診断</h2><p>バーコードの認識処理だけを調べます。認識した情報はサーバーには送信しません。初回はインターネット接続が必要です。</p><section><b>① 読取エンジン</b><p id="library">未読込</p><button id="load">エンジンの動作確認</button></section><section><b>② カメラ</b><p><button id="start">カメラ開始</button><button id="stop">停止</button></p><video id="v" hidden autoplay muted playsinline></video><p id="attempt">未起動</p></section><section><b>③ PTPバーコードの写真</b><p><input type="file" accept="image/*" id="photo"></p><img id="preview" hidden></section><section><b>診断結果</b><p id="state">待機中</p><pre id="result">未認識</pre><details><summary>詳細ログ</summary><pre id="log"></pre></details><button id="copy">診断ログをコピー</button></section><small>薬剤の正式な照合・登録機能はありません。試験用の独立ページです。</small><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let reader,active=false,tries=0,history=[];function log(s){history.push(new Date().toLocaleTimeString('ja-JP')+' '+s);$('log').textContent=history.slice(-40).join('\n')}function status(s){$('state').textContent=s;log(s)}let pending;function engine(){if(window.ZXing?.BrowserMultiFormatReader)return Promise.resolve(window.ZXing);if(pending)return pending;$('library').textContent='通信中';pending=new Promise((ok,bad)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';sc.onload=()=>window.ZXing?.BrowserMultiFormatReader?ok(window.ZXing):bad(Error('読取エンジンの形式が一致しません'));sc.onerror=()=>bad(Error('読取エンジンのダウンロードに失敗'));document.head.append(sc)}).then(z=>{$('library').textContent='ZXing 読込成功';log('エンジン読込成功');return z}).catch(e=>{$('library').textContent='失敗: '+e.message;pending=null;throw e});return pending}
function make(z){const hints=new Map();hints.set(z.DecodeHintType.POSSIBLE_FORMATS,[z.BarcodeFormat.CODE_128,z.BarcodeFormat.DATA_MATRIX,z.BarcodeFormat.EAN_13,z.BarcodeFormat.ITF]);hints.set(z.DecodeHintType.TRY_HARDER,true);hints.set(z.DecodeHintType.ASSUME_GS1,true);return new z.BrowserMultiFormatReader(hints,300)}function end(){active=false;try{reader?.reset()}catch(e){}const v=$('v');v.srcObject?.getTracks()?.forEach(t=>t.stop());v.srcObject=null;v.hidden=true}function report(r){const raw=r.getText();const stripped=raw.replace(/^\][A-Za-z0-9]{2}/,'').replace(/[\x1d\x1e\x1f]/g,'|');const m=stripped.match(/\(01\)\s*(\d{14})/)||stripped.match(/(?:^|\|)01(\d{14})/)||stripped.match(/^(\d{14})(?:\||$)/);$('result').textContent='認識形式: '+String(r.getBarcodeFormat())+'\n生データ: '+JSON.stringify(raw)+'\nGTIN: '+(m?m[1]:'未抽出');status('バーコード認識成功');end()}
$('load').onclick=()=>engine().catch(e=>status(e.message));$('stop').onclick=()=>{end();status('停止しました')};$('start').onclick=async()=>{end();tries=0;try{const z=await engine();reader=make(z);active=true;const v=$('v');v.hidden=false;status('カメラ・認識開始中');await reader.decodeFromVideoDevice(null,v,(r,err)=>{if(!active)return;tries++;if(r)return report(r);if(tries%20===0)$('attempt').textContent='認識試行 '+tries+'回・最新: '+(err?.name||'未認識')});$('attempt').textContent='カメラは起動しました'}catch(e){end();status('カメラエラー: '+e.message)}};$('photo').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;status('写真を認識中');let url;try{const z=await engine();url=URL.createObjectURL(f);const im=new Image();im.src=url;await im.decode();$('preview').src=url;$('preview').hidden=false;const c=document.createElement('canvas');const k=Math.min(1,2400/Math.max(im.naturalWidth,im.naturalHeight));c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const r=await make(z).decodeFromImageUrl(c.toDataURL('image/png'));report(r)}catch(ex){status('写真エラー: '+ex.name+' '+ex.message)}finally{if(url)URL.revokeObjectURL(url)}};$('copy').onclick=()=>{const t=$('state').textContent+'\n'+$('result').textContent+'\n'+$('log').textContent;navigator.clipboard?.writeText(t).then(()=>status('コピーしました')).catch(()=>{$('result').textContent=t})};window.addEventListener('error',e=>log('JavaScriptエラー '+e.message));window.addEventListener('unhandledrejection',e=>log('非同期エラー '+String(e.reason)));log('画面読み込み完了')})();
</script></html>
