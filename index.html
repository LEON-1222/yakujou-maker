<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薬情メーカー Ver.2.3.1 | デモ</title><style>
:root{--ink:#172233;--line:#dbb0ad;--rose:#a54a4b;--panel:#f6f8fb}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#edf1f5;margin:0}header{padding:14px 20px;background:#17283d;color:white;display:flex;align-items:center;justify-content:space-between;gap:10px}header strong{font-size:19px}header small{display:block;color:#bbd0e1;font-size:11px}button{background:#17669c;border:0;color:white;padding:10px 15px;border-radius:9px;font-weight:700;cursor:pointer;font-size:14px}button.secondary{background:#e9eff4;color:#20344c}button.danger{background:#fff1ee;color:#aa3e40}button:disabled{opacity:.5}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;max-width:1480px;margin:18px auto;padding:0 16px}.controls{background:white;border-radius:14px;padding:17px;align-self:start;box-shadow:0 2px 12px #18253e13}.controls h2{font-size:18px;margin:0 0 9px}.hint{font-size:12px;color:#617084;line-height:1.6}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd3df;border-radius:7px;padding:9px;background:#fff;color:#152333;font:inherit;font-size:14px}.field textarea{min-height:65px;resize:vertical}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.timeinputs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.timeinputs input{text-align:center;padding:8px 2px}.timeinputs label{text-align:center}.buttonrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.drugpicker{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.drugpicker button{background:#eaf0f5;color:#25394c;padding:7px 10px}.drugpicker button.active{background:#17669c;color:white}.preview{min-width:0}.previewbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0 0 10px}.previewbar span{font-size:13px;color:#576a7c}.sheet{background:white;width:100%;max-width:900px;margin:auto;padding:30px 24px 22px;box-shadow:0 4px 20px #14253b20;min-height:1040px}.sheetheader{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:14px}.sheetheader h1{font-size:29px;margin:0}.sheetheader small{color:#526174;font-size:12px}.medtable{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #c97976}.medtable th{background:#faeded;text-align:center;padding:10px 5px;border:1px solid #cf9b98;font-size:13px}.medtable td{border:1px solid #d7a3a0;vertical-align:top;padding:11px 8px;font-size:12px;line-height:1.6;overflow-wrap:anywhere}.medtable th:nth-child(1){width:25%}.medtable th:nth-child(2){width:24%}.medtable th:nth-child(3){width:33%}.medtable th:nth-child(4){width:18%}.medname{font-weight:800;font-size:15px;margin:0 0 8px}.pillmock{height:65px;background:linear-gradient(135deg,#eef1f3,#fafafa);border-radius:6px;display:flex;justify-content:center;align-items:center;margin-bottom:6px}.pill{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#fff,#ccd4d9);box-shadow:3px 4px 8px #0002;display:grid;place-items:center;color:#8b95a0;font-size:11px}.pack{display:inline-block;background:#bc6868;color:white;border-radius:6px;font-size:10px;padding:2px 5px;margin-bottom:4px}.mocknotice{font-size:9px;color:#697788}.times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.timehead{font-weight:750;text-align:center;background:#eaf0f3;border-radius:4px;padding:2px}.dose{text-align:center;background:#f4f6f8;border-radius:4px;padding:8px 0;font-weight:800;font-size:17px;white-space:nowrap}.dose.two{color:#e77516}.dose.three{color:#d02430}.condition{text-align:center;margin-top:3px;border-radius:4px;font-weight:bold;font-size:10px;padding:3px 0;min-height:20px}.after{background:#edf0f2;color:#364454}.before{background:#ffe49d;color:#3a2c0a}.immediatelyBefore{background:#ffcfcf;color:#70252e}.immediatelyAfter{background:#bfe4ff;color:#1b4a70}.between{background:#e8d4ff;color:#5a2a80}.bed{background:#e7ebef;color:#34475d}.other{background:#f5dbb5;color:#673c1f}.nodose{visibility:hidden}.duration{font-size:11px;margin-top:9px}.legend{border:1px solid #efd5d3;border-radius:9px;padding:10px;margin-top:15px;font-size:11px;line-height:2}.legend em{font-style:normal;padding:4px 7px;border-radius:4px;margin-right:4px}.legend .orange{color:#df6c11;font-weight:800}.legend .red{color:#d02430;font-weight:800}.footer{margin-top:15px;border-top:1px solid #cbd3db;padding-top:10px;font-size:11px}.notice{margin:12px 0;padding:10px;border-left:4px solid #b96d54;background:#fff7ef;font-size:12px;line-height:1.6}.photo-preview{max-width:100%;max-height:125px;object-fit:contain;border-radius:6px}.empty{padding:25px;text-align:center;color:#778}.mini{color:#6c7887;font-size:10px} @media(max-width:1000px){.layout{grid-template-columns:1fr}.controls{max-width:900px;width:100%;margin:auto}.sheet{padding:22px 15px}.medtable td{padding:8px 5px}}@media(max-width:650px){.sheet{min-width:700px}.preview{overflow:auto}.sheetheader h1{font-size:22px}header strong{font-size:15px}}@page{size:A4 portrait;margin:12mm}@media print{html,body{background:white;margin:0;padding:0}header,.controls,.previewbar,.notice{display:none!important}.layout{display:block;margin:0;padding:0}.preview{overflow:visible}.sheet{box-shadow:none;width:100%;max-width:none;min-height:0;padding:0}.medtable{font-size:10px}.medtable tr{break-inside:avoid}.medtable td{font-size:10px;padding:6px}.medname{font-size:12px}.dose{font-size:14px}.sheetheader h1{font-size:23px}.footer{margin-top:10px}}
</style></head><body><header><div><strong>💊 薬情メーカー Ver.2.3.1</strong><small>処方確認・帳票作成の試作｜架空データ専用（修正版）</small></div><button onclick="window.print()">A4で印刷 / PDF保存</button></header><main class="layout"><section class="controls"><h2>処方情報を編集</h2><p class="hint">薬剤ボタンを選び、用法や錠数を変えると右の薬情が更新されます。個人情報・実患者データは入力しないでください。</p><div class="fieldrow"><div class="field"><label>患者名（架空のみ）</label><input id="patient" value="サンプル患者"></div><div class="field"><label>交付日</label><input type="date" id="date" value="2026-10-17"></div></div><div id="picker" class="drugpicker"></div><div id="editor"></div><div class="buttonrow"><button id="add">＋ 薬を追加</button><button id="remove" class="danger">選択薬を削除</button></div><div class="buttonrow"><button id="reset" class="secondary">サンプルに戻す</button><button onclick="window.print()">印刷 / PDF保存</button></div><div class="notice"><b>この版でできること：</b>薬情の編集・表示・印刷。<br><b>未実装：</b>処方箋QR・OCR読み取り、実薬剤マスター、監査、電子保存、ファーミー連携。入力データはサーバーに送信・保存しません。画面が白い場合はSafariで開いてください。</div></section><section class="preview"><div class="previewbar"><b>薬剤情報提供書プレビュー</b><span>横にスクロールして確認できます</span></div><article id="sheet" class="sheet"></article></section></main>
<script>
const original=[{name:'サンプル薬A 10mg',effect:'血圧を下げる働きがある薬の説明を掲載します。（架空の説明）',caution:'主な注意事項を表示します。実際の薬剤情報ではありません。',doses:[1,0,0,0],conditions:['食後','','',''],days:28,pack:false},{name:'サンプル薬B 5mg',effect:'胃の症状に関する説明文の例です。（架空の説明）',caution:'主な副作用・注意事項欄の例です。',doses:[2,0,2,0],conditions:['食前','','食前',''],days:28,pack:true},{name:'サンプル薬C 20mg',effect:'アレルギー症状に関する説明文の例です。（架空の説明）',caution:'主な副作用・注意事項欄の例です。',doses:[1,1,1,0],conditions:['食直後','食直後','食直後',''],days:14,pack:false},{name:'サンプル薬D 2mg',effect:'気管支についての説明文の例です。（架空の説明）',caution:'主な副作用・注意事項欄の例です。',doses:[0,3,0,0],conditions:['','食間','',''],days:28,pack:true}];let drugs=JSON.parse(JSON.stringify(original)),active=0;const $=s=>document.querySelector(s);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const conditionClass={'食後':'after','食前':'before','食直前':'immediatelyBefore','食直後':'immediatelyAfter','食間':'between','就寝前':'bed','その他':'other'};const times=['朝','昼','夕','寝'];const conditions=['食後','食前','食直前','食直後','食間','就寝前','その他'];function picker(){ $('#picker').innerHTML=drugs.map((d,i)=>`<button class="${i===active?'active':''}" data-pick="${i}">薬 ${i+1}</button>`).join('');document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{active=+b.dataset.pick;render()})}function editor(){const d=drugs[active];$('#editor').innerHTML=`<div class="field"><label>薬品名（架空）</label><input data-key="name" value="${escapeHTML(d.name)}"></div><div class="field"><label>効果の説明（架空）</label><textarea data-key="effect">${escapeHTML(d.effect)}</textarea></div><div class="field"><label>注意事項（架空）</label><textarea data-key="caution">${escapeHTML(d.caution)}</textarea></div><div class="field"><label>服用量（0＝服用しない）</label><div class="timeinputs">${times.map((t,i)=>`<div><label>${t}</label><input type="number" min="0" max="99" step="0.5" data-dose="${i}" value="${d.doses[i]}"></div>`).join('')}</div></div><div class="field"><label>服用条件（各時点）</label><div class="timeinputs">${times.map((t,i)=>`<div><label>${t}</label><select data-condition="${i}"><option value="">―</option>${conditions.map(c=>`<option value="${c}" ${d.conditions[i]===c?'selected':''}>${c}</option>`).join('')}</select></div>`).join('')}</div></div><div class="fieldrow"><div class="field"><label>日数</label><input type="number" min="1" max="365" data-key="days" value="${d.days}"></div><div class="field"><label>一包化</label><select data-key="pack"><option value="false" ${!d.pack?'selected':''}>なし</option><option value="true" ${d.pack?'selected':''}>あり</option></select></div></div>`;document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{const k=el.dataset.key;d[k]=k==='days'?Number(el.value):k==='pack'?el.value==='true':el.value;sheet()}));document.querySelectorAll('[data-dose]').forEach(el=>el.addEventListener('input',()=>{d.doses[+el.dataset.dose]=Math.max(0,Number(el.value)||0);sheet()}));document.querySelectorAll('[data-condition]').forEach(el=>el.addEventListener('change',()=>{d.conditions[+el.dataset.condition]=el.value;sheet()}))}function sheet(){const date=$('#date').value;const f=date?date.replace(/-/g,'/'):'';$('#sheet').innerHTML=`<div class="sheetheader"><div><h1>💊 お薬の説明書</h1><small>薬の飲み方・効能・注意事項</small></div><div style="text-align:right"><b>${escapeHTML($('#patient').value)} 様</b><br><small>${f}</small><br><small>見本・印刷検証用</small></div></div><table class="medtable"><thead><tr><th>お薬の名前</th><th>効能・効果</th><th>用法・用量</th><th>注意すること</th></tr></thead><tbody>${drugs.map((d,i)=>`<tr><td><div class="medname">${escapeHTML(d.name)}</div>${d.pack?'<span class="pack">一包化</span>':''}<div class="pillmock"><span class="pill">S${i+1}</span></div><span class="mocknotice">サンプル画像（実薬ではありません）</span></td><td>${escapeHTML(d.effect)}</td><td><div class="times">${times.map(t=>`<div class="timehead">${t}</div>`).join('')}${d.doses.map(v=>`<div class="dose ${v>=3?'three':v>=2?'two':''}">${v>0?escapeHTML(v)+'錠':'―'}</div>`).join('')}${d.conditions.map((c,i)=>`<div class="condition ${d.doses[i]>0?(conditionClass[c]||'other'):'nodose'}">${d.doses[i]>0?escapeHTML(c||'時間指定'):'―'}</div>`).join('')}</div><div class="duration">${escapeHTML(d.days)}日分　（服用条件は上欄参照）</div></td><td>${escapeHTML(d.caution)}</td></tr>`).join('')}</tbody></table><div class="legend"><b>服用時点・錠数の色分け：</b> <em class="before">食前</em><em class="immediatelyBefore">食直前</em><em class="immediatelyAfter">食直後</em><em class="between">食間</em> ／ <span class="orange">2錠＝オレンジ</span>・<span class="red">3錠以上＝赤</span> ／ 1錠＝黒</div><div class="footer"><b>サンプル調剤薬局</b>　（架空の薬局）<p class="mini">※本紙はWEBアプリの表示・印刷テストです。実際の医薬品情報・服用指示・薬剤写真ではありません。患者への交付や服薬判断には使用できません。</p></div>`}function render(){picker();editor();sheet()}$('#patient').oninput=sheet;$('#date').oninput=sheet;$('#add').onclick=()=>{drugs.push({name:`サンプル薬${drugs.length+1}`,effect:'説明文（架空）',caution:'注意事項（架空）',doses:[1,0,0,0],conditions:['食後','','',''],days:14,pack:false});active=drugs.length-1;render()};$('#remove').onclick=()=>{if(drugs.length===1){alert('最低1剤必要です');return}drugs.splice(active,1);active=Math.max(0,active-1);render()};$('#reset').onclick=()=>{drugs=JSON.parse(JSON.stringify(original));active=0;render()};render();
</script></body></html>
