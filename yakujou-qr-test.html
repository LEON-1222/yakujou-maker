<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薬情 QR読取テスト</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;margin:0;background:#eef2f6;color:#14243c}main{max-width:740px;margin:20px auto;padding:16px}section{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0001}h1{font-size:24px}button{background:#17679b;color:white;border:0;border-radius:9px;padding:13px 16px;margin:5px;font-weight:bold;font-size:16px}button:disabled{opacity:.5}input{padding:12px;max-width:100%}video{width:100%;max-height:340px;background:#222}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd4df;padding:9px;text-align:left}small,p{line-height:1.6}.warning{background:#fff5e8;padding:11px;border-radius:8px}.state{font-weight:700;white-space:pre-wrap}textarea{width:100%;height:100px;box-sizing:border-box}a{color:#17679b}</style><main><h1>処方QR 読取テスト <small>Ver.0.1</small></h1><section><p class="warning"><b>架空データ専用です。</b> GitHub Pagesなど一般公開のページには実際の処方箋や患者データを読み込ませないでください。処方箋QRの標準規格（JAHIS）にはまだ非対応です。</p><button id="sample">① テストデータで動作確認</button><button id="camera">② カメラでQR読取</button><button id="stop" style="background:#687789">カメラ停止</button><p><label>③ QR画像を選んで読取（対応ブラウザのみ）<br><input type="file" id="upload" accept="image/*"></label></p><video id="video" playsinline muted hidden></video><p id="status" class="state">まず①を押してください。</p><details><summary>QRの文字列を貼り付けて確認</summary><textarea id="raw" placeholder="架空のテスト用データのみ"></textarea><button id="parse">解析する</button></details></section><section><h2>読み取り結果</h2><div id="result">まだ読み取っていません。</div></section><section><p>このページはQRの読み取り機能を検証するための独立した試作品です。既存の薬情メーカーへの連携、医薬品マスター、正式な処方箋QRへの対応は未実装です。</p></section></main><script>
const sample={"type": "YAKUJOU_DEMO_V1", "patient": "テスト患者", "medicines": [{"name": "サンプル薬A 10mg", "am": 1, "noon": 0, "pm": 0, "bed": 0, "when": "食後", "days": 14}, {"name": "サンプル薬B 5mg", "am": 2, "noon": 0, "pm": 2, "bed": 0, "when": "食前", "days": 7}]};let stream=null,reading=false;const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(x){try{let obj=typeof x==='string'?JSON.parse(x):x;if(obj.type!=='YAKUJOU_DEMO_V1'||!Array.isArray(obj.medicines))throw Error('このQRはテスト用形式ではありません。実際の処方箋QRにはまだ対応していません。');$('result').innerHTML='<p><b>患者：</b>'+safe(obj.patient)+'（架空）</p><table><thead><tr><th>薬品名</th><th>朝</th><th>昼</th><th>夕</th><th>寝</th><th>服用条件</th><th>日数</th></tr></thead><tbody>'+obj.medicines.map(d=>'<tr><td>'+safe(d.name)+'</td>'+['am','noon','pm','bed'].map(k=>'<td>'+safe(d[k]||'―')+'</td>').join('')+'<td>'+safe(d.when)+'</td><td>'+safe(d.days)+'</td></tr>').join('')+'</tbody></table>';$('status').textContent='読み取り成功（テストデータ）';return true}catch(e){$('status').textContent='解析できません：'+e.message;return false}}$('sample').onclick=()=>show(sample);$('parse').onclick=()=>show($('raw').value);function detector(){return 'BarcodeDetector' in window?new BarcodeDetector({formats:['qr_code']}):null}async function stop(){reading=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').hidden=true} $('stop').onclick=stop;
$('camera').onclick=async()=>{await stop();let d=detector();if(!d){$('status').textContent='このSafariでは標準QR検出機能が利用できません。画像読み込みも同様に制限されます。①のテストは可能です。';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('video').srcObject=stream;$('video').hidden=false;await $('video').play();reading=true;$('status').textContent='架空のテスト用QRをカメラに映してください。';while(reading){try{let codes=await d.detect($('video'));if(codes.length&&show(codes[0].rawValue)){await stop();break}}catch(e){}await new Promise(r=>setTimeout(r,250))}}catch(e){$('status').textContent='カメラを開始できません：'+e.message;await stop()}};
$('upload').onchange=async e=>{let f=e.target.files[0];if(!f)return;let d=detector();if(!d){$('status').textContent='このブラウザではQR画像の解析に未対応です。';return}try{const b=await createImageBitmap(f);let codes=await d.detect(b);if(!codes.length)throw Error('QRコードが検出できません。');show(codes[0].rawValue)}catch(err){$('status').textContent='画像を解析できません：'+err.message}};
</script></html>
